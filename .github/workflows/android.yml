name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "beta-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: renewly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release with APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "renewly-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" "renewly-${GITHUB_REF_NAME}.apk" \
            --title "Renewly ${GITHUB_REF_NAME}" \
            --notes "Renewly ${GITHUB_REF_NAME} — offline-first subscription tracker. Everything runs on the phone: manual and catalog-assisted entry, Philippine plan prices, local payment labels, due/overdue reminders, and JSON export/import. No server or account. Install the APK below (debug-signed build)." \
            --repo "${GITHUB_REPOSITORY}"
