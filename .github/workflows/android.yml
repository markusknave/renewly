name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "beta-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: renewly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release with APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "renewly-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" "renewly-${GITHUB_REF_NAME}.apk" \
            --title "Renewly ${GITHUB_REF_NAME}" \
            --notes "Renewly ${GITHUB_REF_NAME} — offline-first subscription tracker. Everything runs on the phone: manual and catalog-assisted entry, Philippine plan prices, local payment labels, due/overdue reminders, and JSON export/import. No server or account. Install the APK below (debug-signed build)." \
            --repo "${GITHUB_REPOSITORY}"
