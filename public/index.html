<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#6d4aff" />
		<meta
			name="description"
			content="Renewly tracks subscriptions, expenses, transfers, and Philippine card and e-wallet balances, with themes, custom fonts, goals, and CSV, Excel, or PDF exports. Everything stays on this device."
		/>
		<title>Renewly — expenses, cards, and subscriptions</title>
		<link rel="manifest" href="./manifest.webmanifest" />
		<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
		<link rel="stylesheet" href="./fonts/fonts.css" />
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<header class="topbar">
			<a class="brand" href="#/">
				<span class="brand-mark" aria-hidden="true">R</span>
				Renewly
			</a>
			<nav class="nav desktop-nav" id="nav" aria-label="Main">
				<a href="#/" data-nav="home">Overview</a>
				<a href="#/cards" data-nav="cards">Cards</a>
				<a href="#/expenses" data-nav="expenses">Activity</a>
				<a href="#/subscriptions" data-nav="subscriptions">Plan</a>
				<a href="#/goals" data-nav="goals">Goals</a>
				<a href="#/insights" data-nav="insights">Insights</a>
				<a href="#/more" data-nav="more">More</a>
			</nav>
			<span class="version-pill">beta-2.2</span>
		</header>
		<main class="container wide" id="app" aria-live="polite">
			<p class="muted">Loading…</p>
		</main>

		<button class="fab" type="button" data-action="new-expense" aria-label="Add expense">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
				<path d="M12 5v14M5 12h14" />
			</svg>
		</button>

		<nav class="bottom-nav" aria-label="Primary">
			<a href="#/" data-nav="home">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M3 10.4 12 3l9 7.4" /><path d="M5.5 9.5V20h13V9.5" /><path d="M9.5 20v-6h5v6" />
				</svg>
				<span>Home</span>
			</a>
			<a href="#/cards" data-nav="cards">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<rect x="3" y="5.5" width="18" height="13" rx="3" /><path d="M3 10h18" /><path d="M7 15h3" />
				</svg>
				<span>Cards</span>
			</a>
			<a href="#/expenses" data-nav="expenses" class="center-tab">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
					<path d="M12 5v14M5 12h14" />
				</svg>
				<span>Activity</span>
			</a>
			<a href="#/subscriptions" data-nav="subscriptions">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M20 12a8 8 0 1 1-2.3-5.7" /><path d="M20 4v5h-5" />
				</svg>
				<span>Plan</span>
			</a>
			<a href="#/more" data-nav="more">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<rect x="3.5" y="3.5" width="7" height="7" rx="2" /><rect x="13.5" y="3.5" width="7" height="7" rx="2" /><rect x="3.5" y="13.5" width="7" height="7" rx="2" /><rect x="13.5" y="13.5" width="7" height="7" rx="2" />
				</svg>
				<span>More</span>
			</a>
		</nav>

		<noscript><p class="container">Renewly needs JavaScript enabled.</p></noscript>
		<script type="module" src="./js/app.js"></script>
	</body>
</html>
